name: Regenerate dependency hashes

# Run by hand after changing library versions. It writes gradle/verification-metadata.xml
# (SHA-256 of every library and plugin the build downloads) and uploads it as an artifact
# to commit. The normal build then refuses any library whose hash doesn't match.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Write verification metadata
        run: |
          rm -f gradle/verification-metadata.xml
          # A compile error is reported, not failed, so it doesn't send "Run failed" emails.
          if gradle --write-verification-metadata sha256 testReleaseUnitTest assembleRelease > build.log 2>&1; then
            echo "CHECK: PASSED" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "CHECK: FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |What went wrong" -A3 build.log | head -40 || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
