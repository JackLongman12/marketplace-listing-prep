name: Build APK

on:
  push:
    branches: [main]
    # Docs and repo housekeeping don't change the app, so they don't make a new build.
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-hashes.yml'
      - 'assets/**'
  workflow_dispatch:

# Least privilege by default; only the build job may write (to publish the release).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Third-party actions are pinned to exact commits so a moved tag can't inject code
      # into a job that has the signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and tags, for the release notes

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Check for signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_B64 secret yet - compiling only, no release will be published."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.key.outputs.present == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: listingprep
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      # Libraries can quietly add permissions and components via manifest merging; print
      # what actually ships so changes are visible in every build's summary.
      - name: Audit permissions and components
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "### Permissions in the APK"
            echo '```'
            "$BT/aapt2" dump permissions "$APK"
            echo '```'
            echo "### Components (activities, services, receivers, providers)"
            echo '```'
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" \
              | grep -E 'E: (activity|service|receiver|provider)|A: .*(:name|exported)' \
              | grep -vE 'meta-data|intent-filter|action|category|uses-'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK and record its checksum
        if: steps.key.outputs.present == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ListingPrep-${{ github.run_number }}.apk"
          sha256sum "ListingPrep-${{ github.run_number }}.apk" > "ListingPrep-${{ github.run_number }}.apk.sha256"

      # "What's new": every commit since the previous release, without trailer lines.
      - name: Write release notes
        id: notes
        if: steps.key.outputs.present == 'true'
        run: |
          PREV=$(git tag --list 'build-*' --sort=-v:refname | head -1)
          RANGE=${PREV:+$PREV..}HEAD
          CHANGES=$(git log "$RANGE" --no-merges --format=%h -- app | wc -l)
          # No app changes since the last release: compile-check only, don't offer an identical "update".
          echo "changed=$([ "$CHANGES" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## What's new"
            if [ "$CHANGES" -eq 0 ]; then echo; echo "Maintenance build: nothing in the app changed."; fi
            echo
            git log "$RANGE" --no-merges --reverse --format='### %s%n%n%b' -- app README.md \
              | grep -vE '^(Co-Authored-By|Signed-off-by):' || true
            echo
            echo "---"
            echo "Install: download the APK below on your phone and open it. Build 20 and newer update themselves."
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.key.outputs.present == 'true' && steps.notes.outputs.changed == 'true'
        with:
          tag_name: build-${{ github.run_number }}
          name: Listing Prep build ${{ github.run_number }}
          body_path: release-notes.md
          files: |
            ListingPrep-${{ github.run_number }}.apk
            ListingPrep-${{ github.run_number }}.apk.sha256
          make_latest: true
