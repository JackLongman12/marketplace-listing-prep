# Opens pull requests when a pinned GitHub Action or a library has a newer (often
# security-fix) release. After merging a Gradle update, run the
# "Regenerate dependency hashes" workflow and commit its output.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
