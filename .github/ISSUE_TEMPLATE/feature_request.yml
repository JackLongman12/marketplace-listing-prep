name: Feature idea
description: Suggest something new or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would make selling easier?
      description: Describe the problem or the idea in your own words.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How do you picture it working?
